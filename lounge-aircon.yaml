# Merge these settings into your existing device YAML, or use this complete example.
esphome:
  name: lounge-aircon
  friendly_name: Lounge Aircon

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [fujitsu_general]

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

web_server:
  port: 80

switch:
  - platform: gpio
    pin: GPIO21
    id: ir_power
    internal: true
    restore_mode: ALWAYS_ON

remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%
  non_blocking: false

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO14
    inverted: true
  idle: 10ms
  # Uncomment for troubleshooting; the climate decoder itself logs received state.
  # dump: aeha

climate:
  - platform: fujitsu_general
    id: lounge_ac
    name: Air Conditioner
    model: AR_CG1
    forward_remote_commands: true
    transmitter_id: ir_tx
    receiver_id: ir_rx

button:
  - platform: template
    name: Vane Step Vertical
    on_press:
      - lambda: id(lounge_ac).step_vertical();
  - platform: template
    name: Vane Step Horizontal
    on_press:
      - lambda: id(lounge_ac).step_horizontal();
  - platform: template
    name: Assume Swing Stopped
    entity_category: config
    on_press:
      - lambda: |-
          id(lounge_ac).set_assumed_swing(esphome::climate::CLIMATE_SWING_OFF);
